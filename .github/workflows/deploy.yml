name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: server/learning-api/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install learning API dependencies
        run: python -m pip install -r server/learning-api/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Import learning API
        env:
          DATA_DIR: ${{ runner.temp }}/aidatabase-learning
        run: PYTHONPATH=server/learning-api python -c "import main"

      - name: Build
        run: npm run build:github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
